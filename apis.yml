name: The Backplane
description: 'The Backplane, Inc. was a US social-network-builder startup (founded 2011)
  that built branded social networks for fan groups and organizations, most notably Lady
  Gaga''s Little Monsters community, and later pivoted to the Place.xyz network-building
  platform. Backed by Battery Ventures, GV, Sequoia, Greylock and others, it raised roughly
  $18.9M before running out of money, going out of business in April 2016 and selling all of
  its assets (patents, code, trademarks, URLs). The company is defunct; enrichment found no
  live website, developer portal, API, specification, or SDK surface to catalog.'
